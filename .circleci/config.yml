version: 2.1

jobs:
  build_push:
    docker:
      - image: cimg/openjdk:23.0.2
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker Image
          command: docker build -t $DOCKER_LOGIN/tms:latest .
      - persist_to_workspace:
          root: .
          paths:
            - .
      - run:
          name: Login to Docker Hub
          command: echo $DOCKER_PASSWORD | docker login -u $DOCKER_LOGIN --password-stdin
      - run:
          name: Push Docker Image
          command: echo $DOCKER_LOGIN | docker push $DOCKER_LOGIN/tms:latest

workflows:
  version: 2
  build_and_push:
    jobs:
      - build_push:
          filters:
            branches:
              only:
                - keycloak-TMS